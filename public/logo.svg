<svg width="600" height="240" viewBox="0 0 600 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="240" fill="#ffffff" rx="12"/>
  
  <!-- EMBLEM GROUP -->
  <g transform="translate(40, 20)">
    <!-- Red Background Box -->
    <rect x="40" y="20" width="80" height="110" fill="#e52b2b" rx="2" />
    
    <!-- Oval Backdrop -->
    <ellipse cx="80" cy="72" rx="46" ry="60" fill="#ffffff" />
    <ellipse cx="80" cy="72" rx="42" ry="56" fill="#008ecf" />
    <ellipse cx="80" cy="72" rx="46" ry="60" stroke="#e52b2b" stroke-width="3" fill="none" />

    <!-- Crosshair Symbol -->
    <g transform="translate(24, 60)">
      <circle cx="12" cy="12" r="10" fill="#ffffff" />
      <circle cx="12" cy="12" r="8" fill="#e52b2b" />
      <circle cx="12" cy="12" r="4" fill="#ffffff" />
      <circle cx="12" cy="12" r="2" fill="#e52b2b" />
      <line x1="12" y1="0" x2="12" y2="24" stroke="#ffffff" stroke-width="2" />
      <line x1="0" y1="12" x2="24" y2="12" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Stylized White Letter N -->
    <path d="M 52 110 L 52 38 L 74 38 L 108 102 L 108 38 L 122 38 L 122 110 L 100 110 L 66 46 L 66 110 Z" fill="#ffffff" />

    <!-- Red Arc Ring -->
    <path d="M 40 40 C 60 10, 110 10, 130 40 C 145 65, 135 110, 110 132" stroke="#e52b2b" stroke-width="5" stroke-linecap="round" fill="none" />

    <!-- Vogue en Designe Pill -->
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="120" height="24" rx="6" fill="#848a94" />
      <text x="60" y="16" fill="#ffffff" font-size="12" font-weight="800" font-family="sans-serif" text-anchor="middle">Vogue en Designe</text>
    </g>
  </g>

  <!-- TEXT GROUP -->
  <text x="210" y="115" fill="#008ecf" font-size="28" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.5">WOODYNAT DESIGNERS LTD</text>
  <text x="212" y="152" fill="#1e2430" font-size="17" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="-0.2">Your Reliable Partner in Design and Branding</text>
</svg>
