<svg width="560" height="380" viewBox="0 0 560 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background Box -->
  <rect width="560" height="380" fill="#ffffff" rx="16"/>

  <!-- EMBLEM GROUP (CENTERED AT X=280) -->
  <g transform="translate(280, 135)">
    <!-- 1. Red Background Box -->
    <rect x="-55" y="-60" width="110" height="142" fill="#ED1C24" rx="4" />

    <!-- 2. Tilted Blue Oval with Letter N (Rotated -20 deg) -->
    <g transform="rotate(-20)">
      <!-- Outer Red Outline Ring -->
      <ellipse cx="0" cy="0" rx="64" ry="86" fill="none" stroke="#ED1C24" stroke-width="7" />
      <!-- White Ring Spacer -->
      <ellipse cx="0" cy="0" rx="58" ry="80" fill="#ffffff" />
      <!-- Inner Vibrant Blue Oval -->
      <ellipse cx="0" cy="0" rx="52" ry="74" fill="#0084D1" />
      <!-- Stylized White Letter N inside Oval -->
      <path d="M -32,54 L -32,-48 L -14,-48 L 16,36 L 16,-48 L 32,-48 L 32,54 L 14,54 L -14,-28 L -14,54 Z" fill="#ffffff" />
    </g>

    <!-- 3. Target / Crosshair Icon on Left Overlap -->
    <g transform="translate(-76, 18)">
      <circle cx="0" cy="0" r="18" fill="#ffffff" />
      <circle cx="0" cy="0" r="14" fill="#ED1C24" />
      <circle cx="0" cy="0" r="7" fill="#ffffff" />
      <circle cx="0" cy="0" r="3.5" fill="#ED1C24" />
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#ffffff" stroke-width="3" />
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#ffffff" stroke-width="3" />
    </g>

    <!-- 4. "Vogue en Designe" Dark Gray Pill Badge -->
    <g transform="translate(0, 102)">
      <rect x="-90" y="-15" width="180" height="30" rx="10" fill="#6B7280" />
      <text x="0" y="5" fill="#ffffff" font-size="16" font-weight="800" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="0.3">Vogue en Designe</text>
    </g>
  </g>

  <!-- COMPANY NAME: WOODYNAT DESIGNERS LTD -->
  <text x="280" y="300" fill="#0084D1" font-size="30" font-weight="900" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="0.8">WOODYNAT DESIGNERS LTD</text>

  <!-- TAGLINE: Your Reliable Partner in Design and Branding -->
  <text x="280" y="338" fill="#1F2937" font-size="17" font-weight="700" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" letter-spacing="0.2">Your Reliable Partner in Design and Branding</text>
</svg>
